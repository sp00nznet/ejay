[flake8]
max-line-length = 100
# E402: gen_exports.py sets up sys.path before importing, so it runs from a
#       checkout without installation.
extend-ignore = E402
# Style is enforced on the tools that are part of this project's surface -
# the conformance harness and the two recovery tools the README tells people to
# run. The lift and decode scripts are research code against a 25-year-old
# binary: they are kept syntactically checked by `compileall` in CI, and are not
# worth churning for line length.
exclude =
    .git, __pycache__, build, build-trace, work, src, original,
    tools/ne_lift.py, tools/ne_decode.py, tools/ne_parse.py,
    tools/lift_dance02.py, tools/lift_dancejay.py, tools/gen_image.py,
    tools/fpu_decode.py, tools/ida_export.py, tools/decode16.py,
    tools/test_engine.py
