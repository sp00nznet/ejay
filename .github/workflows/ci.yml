name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tools:
    name: Analysis tools and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --upgrade pip capstone pefile flake8
      - name: Lint
        run: flake8 tools --max-line-length 100
      - name: Byte-compile
        run: python -m compileall -q tools
      - name: Conformance harness
        # No disc in CI, so this reports that it has nothing to check and exits
        # 0. Run it locally against your own install for the real number, which
        # the README carries.
        run: python tools/conform.py

  host-windows:
    name: eJay 2 host, Windows (32-bit, the DLLs as they are)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        # build.bat finds Visual Studio with vswhere, as a player's setup does.
        # The host builds without a disc; it needs one only to run.
        shell: cmd
        run: call host\build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: ejay2-host-windows
          path: build-windows/ejay2.exe

  host-posix:
    name: eJay 2 host, Linux (compiles against win32hle)
    runs-on: ubuntu-latest
    # The lifted DLLs come from a disc, so CI cannot link the Linux host. It can
    # compile everything of ours against the toolkit's headers, which is where a
    # portability mistake would show.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sp00nznet/pcrecomp
          path: pcrecomp
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev
      - name: Compile
        run: |
          H=pcrecomp/runtime/win32hle
          for f in host/ejay2.c host/posix.c; do
            cc -c -Wall -Werror -Wno-unused-function -Wno-format-truncation -fno-strict-aliasing -fwrapv \
               -DRECOMP_RETADDR=0u -DRECOMP_LOCAL_REGS -DEJAY_TITLE='"ci"' \
               -Ihost -I$H -Ipcrecomp/runtime/recomp32 $(pkg-config --cflags sdl2) \
               "$f" -o "/tmp/$(basename "$f").o"
          done
      - name: The setup script parses
        run: bash -n setup.sh
